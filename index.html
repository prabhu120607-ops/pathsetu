<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathSetu (పథసేతు) — A Bridge to Your Career Future</title>
    <meta
      name="description"
      content="Polished, responsive, and data-driven career guidance platform designed for Indian students. Explainable 5-factor scoring, affordable education pathways in INR, real-time student reviews, and destination discovery with live GPS navigation."
    />
    <link rel="icon" type="image/png" href="/assets/pathsetu-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pathsetu-theme');
          var theme = saved;
          if (!theme) {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
              theme = 'day';
            } else {
              theme = 'night'; // Default to Night Mode
            }
          }
          if (theme === 'night') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'night');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'day');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--text-main)] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
